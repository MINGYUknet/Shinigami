<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maintenance Mode</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      max-width: 500px;
      padding: 30px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .time {
      font-size: 18px;
      margin: 10px 0;
      color: #38bdf8;
    }

    .countdown {
      font-size: 20px;
      font-weight: bold;
      color: #fbbf24;
    }

    .small {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🔧 Maintenance Mode</h1>
    <p>Website sedang dalam proses perbaikan sistem</p>

    <div class="time" id="clock">Loading waktu...</div>

    <div class="countdown" id="countdown"></div>

    <div class="small">Mohon kembali lagi nanti</div>
  </div>

  <script>
    // JAM REAL TIME
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText =
        "Waktu sekarang: " + now.toLocaleString("id-ID");
    }
    setInterval(updateClock, 1000);
    updateClock();

    // COUNTDOWN MAINTENANCE SELESAI
    // ubah tanggal di bawah sesuai kebutuhan
    const maintenanceEnd = new Date();
    maintenanceEnd.setHours(maintenanceEnd.getHours() + 3); // 3 jam dari sekarang

    function updateCountdown() {
      const now = new Date();
      const diff = maintenanceEnd - now;

      if (diff <= 0) {
        document.getElementById("countdown").innerText = "Maintenance selesai!";
        return;
      }

      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("countdown").innerText =
        `Estimasi selesai: ${hours}j ${minutes}m ${seconds}d`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
