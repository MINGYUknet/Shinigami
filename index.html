<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maintenance Mode</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      text-align: center;
      padding: 40px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      max-width: 500px;
      width: 90%;
    }

    .icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
    }

    p {
      opacity: 0.75;
      margin-bottom: 20px;
    }

    .time {
      font-size: 18px;
      color: #38bdf8;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      margin-top: 15px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(56,189,248,0.15);
      color: #38bdf8;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="icon">🔧</div>
    <h1>Website Sedang Maintenance</h1>
    <p>Kami sedang melakukan peningkatan sistem agar lebih baik dan stabil.</p>

    <div class="time" id="clock">Loading waktu...</div>

    <div class="badge">Mohon kembali lagi nanti</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText =
        "Waktu sekarang: " + now.toLocaleString("id-ID");
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
