<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shinigami Robot</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

<!-- NAV -->
<div class="fixed top-0 w-full flex justify-between p-4 bg-black/70 z-50">
  <h1 class="font-bold">Shinigami Robot</h1>
  <button onclick="openMenu()">☰</button>
</div>

<!-- SIDEBAR -->
<div id="sidebar" class="fixed right-0 top-0 w-72 h-full bg-gray-900 p-5 translate-x-full transition">
  <button onclick="closeMenu()">✕</button>

  <ul id="menuList" class="mt-5 space-y-3"></ul>
</div>

<!-- FRAME -->
<iframe id="frame" class="w-full h-screen border-0 pt-14"></iframe>

<script src="menu.js"></script>

<script>
// sidebar control
function openMenu(){
  document.getElementById("sidebar").classList.remove("translate-x-full");
}
function closeMenu(){
  document.getElementById("sidebar").classList.add("translate-x-full");
}

// default page
document.getElementById("frame").src = "/pages/home.html";
</script>

</body>
</html>
