<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shinigami SaaS</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #0f172a, #000);
  overflow: hidden;
}

/* glass effect */
.glass {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(14px);
  border-right: 1px solid rgba(255,255,255,0.08);
}

/* glow active */
.active {
  background: rgba(34,211,238,0.12);
  border-left: 3px solid #22d3ee;
  color: #22d3ee;
}

/* iframe transition */
iframe {
  transition: opacity 0.3s ease;
}
</style>
</head>

<body class="text-white">

<!-- SIDEBAR -->
<div class="fixed left-0 top-0 w-64 h-full glass p-4">

  <h1 class="text-xl font-bold mb-6 tracking-widest text-cyan-400">
    SHINIGAMI SaaS
  </h1>

  <ul id="menuList" class="space-y-2"></ul>
</div>

<!-- TOP BAR -->
<div class="fixed left-64 top-0 right-0 h-14 glass flex items-center px-6">
  <p class="text-sm text-gray-300">Dashboard / <span id="pageTitle">Home</span></p>
</div>

<!-- CONTENT -->
<div class="ml-64 mt-14 h-screen">
  <iframe id="frame" class="w-full h-full border-0"></iframe>
</div>

<script src="/menu.js"></script>

<script>
const frame = document.getElementById("frame");
const title = document.getElementById("pageTitle");

function loadPage(page, name){
  frame.style.opacity = 0;

  setTimeout(() => {
    frame.src = page;
    title.innerText = name;
    setActive(name);
    frame.style.opacity = 1;
  }, 200);
}

function setActive(name){
  document.querySelectorAll(".menu-item").forEach(el => {
    el.classList.remove("active");
    if(el.innerText === name){
      el.classList.add("active");
    }
  });
}
</script>

</body>
</html>
