<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery</title>

  <!-- GLOBAL STYLE -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* ===== PAGE SPECIFIC (TETAP NYAMBUNG STYLE GLOBAL) ===== */

    .page-wrapper {
      padding: 30px;
      text-align: center;
      color: white;
    }

    .page-title {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .page-subtitle {
      opacity: 0.7;
      margin-bottom: 20px;
    }

    /* FILTER */
    .filter {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filter button {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.3s;
    }

    .filter button:hover {
      background: rgba(56,189,248,0.2);
      border-color: #38bdf8;
    }

    /* GRID */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      max-width: 1100px;
      margin: auto;
    }

    .item {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: 0.3s;
    }

    .item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: transform 0.4s ease;
      display: block;
    }

    .item:hover img {
      transform: scale(1.1);
    }

    .item:hover {
      border-color: #38bdf8;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 10px;
      font-size: 13px;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 12px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      cursor: pointer;
      color: white;
    }
  </style>
</head>

<body>

  <!-- PAGE CONTENT -->
  <div class="page-wrapper">
    <h1 class="page-title">🖼️ Gallery</h1>
    <p class="page-subtitle">Kumpulan gambar modern UI system</p>

    <!-- FILTER -->
    <div class="filter">
      <button onclick="filterGallery('all')">All</button>
      <button onclick="filterGallery('nature')">Nature</button>
      <button onclick="filterGallery('tech')">Tech</button>
      <button onclick="filterGallery('city')">City</button>
    </div>

    <!-- GALLERY -->
    <div class="gallery">

      <div class="item nature">
        <img src="https://picsum.photos/id/1015/600/400" onclick="openLightbox(this)">
        <div class="overlay">Nature 1</div>
      </div>

      <div class="item tech">
        <img src="https://picsum.photos/id/180/600/400" onclick="openLightbox(this)">
        <div class="overlay">Tech 1</div>
      </div>

      <div class="item city">
        <img src="https://picsum.photos/id/1011/600/400" onclick="openLightbox(this)">
        <div class="overlay">City 1</div>
      </div>

      <div class="item nature">
        <img src="https://picsum.photos/id/1025/600/400" onclick="openLightbox(this)">
        <div class="overlay">Nature 2</div>
      </div>

    </div>
  </div>

  <!-- LIGHTBOX (GLOBAL STYLE FRIENDLY) -->
  <div class="lightbox" id="lightbox">
    <span class="close" onclick="closeLightbox()">×</span>
    <img id="lightbox-img">
  </div>

  <!-- GLOBAL SCRIPT -->
  <script src="script.js"></script>

  <!-- PAGE SCRIPT (MINIMAL ONLY) -->
  <script>
    function filterGallery(category) {
      const items = document.querySelectorAll(".item");

      items.forEach(item => {
        if (category === "all") {
          item.style.display = "block";
        } else {
          item.style.display = item.classList.contains(category) ? "block" : "none";
        }
      });
    }

    function openLightbox(img) {
      document.getElementById("lightbox").style.display = "flex";
      document.getElementById("lightbox-img").src = img.src;
    }

    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }

    document.getElementById("lightbox").addEventListener("click", function(e){
      if (e.target === this) closeLightbox();
    });
  </script>

</body>
</html>
