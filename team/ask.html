<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ask Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white flex items-center justify-center min-h-screen">

<div class="w-full max-w-md p-6 bg-gray-900 rounded-xl">

  <h1 class="text-xl font-bold mb-4 text-center">Ask Admin</h1>

  <input id="name" class="w-full p-3 mb-3 bg-black border rounded" placeholder="Name">
  <textarea id="message" class="w-full p-3 mb-3 bg-black border rounded h-32" placeholder="Message"></textarea>

  <button onclick="send()" class="w-full bg-cyan-600 p-3 rounded">
    Send
  </button>

</div>

<script>
async function send() {
  const name = document.getElementById("name").value;
  const message = document.getElementById("message").value;

  const res = await fetch("/api/ask", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ name, message })
  });

  const data = await res.json();

  alert(data.success ? "Sent!" : "Failed!");
}
</script>

</body>
</html>
