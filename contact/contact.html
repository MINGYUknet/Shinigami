<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .contact-box {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .contact-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .contact-card h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .contact-card p {
      text-align: center;
      opacity: 0.7;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      opacity: 0.8;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.3);
      color: white;
      outline: none;
    }

    .form-group textarea {
      resize: none;
      height: 120px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    .info {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="page-wrapper">

    <div class="contact-box">

      <div class="contact-card">

        <h1>📩 Contact Us</h1>
        <p>Kirim pesan langsung ke email kami</p>

        <!-- FORM MAILTO GMAIL -->
        <form id="contactForm">

          <div class="form-group">
            <label>Nama</label>
            <input type="text" id="name" required>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
          </div>

          <div class="form-group">
            <label>Pesan</label>
            <textarea id="message" required></textarea>
          </div>

          <button type="submit" class="btn">Kirim ke Gmail</button>

        </form>

        <div class="info">
          Email akan terbuka di aplikasi Gmail / browser kamu
        </div>

      </div>

    </div>

  </div>

  <!-- MENU SYSTEM DULU -->
<script src="../menu.js"></script>

<!-- BARU MAINTENANCE SYSTEM -->
<script src="../script.js"></script>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;

      const subject = encodeURIComponent("Pesan dari " + name);
      const body = encodeURIComponent(
        "Nama: " + name + "\n" +
        "Email: " + email + "\n\n" +
        "Pesan:\n" + message
      );

      // GANTI EMAIL INI DENGAN EMAIL KAMU
      window.location.href = `mailto:wakeoneteam@gmail.com?subject=${subject}&body=${body}`;
    });
  </script>

</body>
</html>
