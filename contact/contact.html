<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-10">

<h1 class="text-3xl font-bold mb-4">Contact</h1>

<input id="name" class="w-full p-3 mb-2 bg-gray-800" placeholder="Name"/>
<input id="email" class="w-full p-3 mb-2 bg-gray-800" placeholder="Email"/>
<textarea id="message" class="w-full p-3 mb-2 bg-gray-800" placeholder="Message"></textarea>

<button onclick="send()" class="bg-blue-600 px-4 py-2 rounded">
Send
</button>

<script>
async function send(){
  await fetch("/api/message", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      type:"contact",
      name:document.getElementById("name").value,
      email:document.getElementById("email").value,
      message:document.getElementById("message").value
    })
  });

  alert("Sent to wakeoneteam@gmail.com");
}
</script>

</body>
</html>
